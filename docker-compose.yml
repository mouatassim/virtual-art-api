version: '3.8'

services:
  api:
    build: .
    container_name: virtual-art-api
    ports:
      - "3010:3010"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: virtual-art-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtual_art_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  pgdata:
